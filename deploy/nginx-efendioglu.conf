# /etc/nginx/sites-available/efendioglu
# Statik export (onerilen): `next build` ciktisi olan out/ klasorunu dogrudan servis eder.
# Kurulum: deploy/README.md
#
# NOT (nginx davranisi): bir location icinde add_header kullanilirsa server
# seviyesindekiler o location icin devre disi kalir. Bu yuzden guvenlik
# basliklari cache verilen location'larda da tekrarlanmistir.

server {
    listen 80;
    listen [::]:80;
    server_name efendioglugroup.com.tr www.efendioglugroup.com.tr;

    root /var/www/efendioglu/out;
    index index.html;

    # Nginx surumunu gizle
    server_tokens off;

    # Sadece okuma metodlari
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Guvenlik basliklari (server geneli) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS: certbot HTTPS'i kurduktan SONRA asagidaki satiri 443'lu server
    # bloguna ekleyin (certbot bu dosyaya 443 blogu ekler):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gizli dosyalara erisimi kapat (.git, .env vb.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Next.js hashli statik dosyalar: 1 yil cache
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # Gorseller: 30 gun cache
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

