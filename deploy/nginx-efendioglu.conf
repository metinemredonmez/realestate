# /etc/nginx/sites-available/efendioglu
# Statik export (onerilen): `next build` ciktisi olan out/ klasorunu dogrudan servis eder.
# Kurulum: deploy/README.md

server {
    listen 80;
    listen [::]:80;
    server_name efendioglugroup.com.tr www.efendioglugroup.com.tr;

    root /var/www/efendioglu/out;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js hashli statik dosyalar: 1 yil cache
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gorseller: 30 gun cache
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Guvenlik basliklari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

